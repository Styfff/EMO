<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root { --accent: #ff6a1a; --ink: #f3f1ec; --grey: #8a9099; --sans: "Inter", sans-serif; --mono: "JetBrains Mono", monospace; --serif: "EB Garamond", serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0b0d10; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse 80% 62% at 42% 58%, #1c2026 0%, #121519 52%, #090a0c 100%); font-family: var(--sans); color: var(--ink); }
      #scene, #scene2d { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
      #ui { position: absolute; inset: 0; }
      #wires { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; overflow: visible; }
      .head { position: absolute; left: 64px; top: 70px; }
      .title { font-weight: 700; font-size: 70px; line-height: 0.98; letter-spacing: -0.025em; }
      .title span { display: block; }
      .sub { margin-top: 18px; font-family: var(--mono); font-size: 28px; color: var(--grey); letter-spacing: 0.02em; }
      .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 31px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 14px; }
      .lbl b { font-family: var(--mono); font-weight: 400; font-size: 27px; color: var(--grey); }
      .lbl.hero, .lbl.hero b { color: var(--accent); }
      .grain { position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none; }
      #hd { position: absolute; left: 60px; top: 56px; right: 60px; color: var(--ink); }
      #hn { font-family: var(--mono); font-size: 22px; color: var(--accent); letter-spacing: 0.06em; }
      #ht { margin-top: 10px; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; line-height: 1.05; }
      #hs { margin-top: 8px; font-family: var(--mono); font-size: 21px; color: var(--accent); letter-spacing: 0.02em; }
      #hc, #hg { margin-top: 10px; font-family: var(--mono); font-size: 21px; line-height: 1.3; color: var(--grey); max-width: 880px; }
      #hg { margin-top: 4px; }
      #root.light #hd { color: #17191c; } #root.light #hc, #root.light #hg { color: #5d5a54; }
      #ui::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 290px; background: linear-gradient(rgba(6,7,9,0.66), rgba(6,7,9,0)); }
      #root.light #ui::before { background: linear-gradient(rgba(250,247,240,0.78), rgba(250,247,240,0)); }
      #root.nohead #hd, #root.nohead #bar, #root.nohead #ui::before { display: none; }
      #bar { position: absolute; left: 60px; right: 60px; bottom: 54px; height: 2px; background: rgba(140,146,156,0.28); }
      #barf { display: block; height: 100%; width: 0; background: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-fps="30" data-start="0" data-duration="432" data-width="1080" data-height="1350">
      <canvas id="scene" data-layout-allow-overflow class="clip" data-start="0" data-duration="432" data-track-index="0"></canvas>
      <div id="ui" class="clip" data-start="0" data-duration="432" data-track-index="1">
        <svg id="wires" viewBox="0 0 1080 1350"></svg>
        <!--EXTRA_HTML-->
        <div id="hd"><div id="hn">01 / 72</div><div id="ht"></div><div id="hs"></div><div id="hc"></div><div id="hg"></div></div>
        <div id="bar"><i id="barf"></i></div>
        <div id="labels"></div>
        
      </div>
    </div>
    <script type="module">
      // la scène est dans assets/scene.js ; elle exporte sa timeline GSAP en pause
      const { tl } = await import("./assets/scene.js");
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
